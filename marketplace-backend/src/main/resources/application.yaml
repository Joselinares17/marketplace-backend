spring:
  main:
    banner-mode: off
    log-startup-info: false
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  application:
    name: marketplace-backend
  modulith:
    detection-strategy: explicitly-annotated
    events:
      completion-mode: update
      republish-outstanding-events-on-restart: true
      jdbc:
        use-legacy-structure: false
        schema-initialization:
          enabled: false
  datasource:
    url: ${DB_URL:}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
  flyway:
    enabled: true
    validate-on-migrate: true
    baseline-on-migrate: false
    clean-disabled: true
  sql:
    init:
      mode: never
  threads:
    virtual:
      enabled: true
  web:
    error:
      include-message: never
      include-binding-errors: never
      include-stacktrace: never
      include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: false

logging:
  level:
    root: INFO
    org.springframework.web: ERROR
    org.springframework.security: WARN
    org.springframework.modulith.events: WARN
    org.flywaydb: WARN
    com.zaxxer.hikari: WARN
    org.postgresql: WARN
  structured:
    format:
      console: ecs
      file: ecs
    json:
      customizer: com.linares.marketplace.bootstrap.config.ProtectedLogging
